name: Scan flyers and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * *'       # every day, about 5:17 am Toronto time (Lococo's changes its specials three times a week)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan this week's flyers (price history and staples digest)
        run: node scripts/scan.mjs
        continue-on-error: true
      - name: Save the scan results to the repository
        continue-on-error: true
        run: |
          git config user.name "grocery-deals scan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update price history and staples digest" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
